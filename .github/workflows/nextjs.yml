# Builds the Next.js frontend as a static export and deploys it to GitHub Pages.
# Payload CMS (admin + API) can't run on Pages, so the build reads product and
# company data from src/seed/data.ts (see scripts/static-export.mjs).
name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      STATIC_EXPORT: "true"
      NEXT_PUBLIC_STATIC_EXPORT: "true"
      PAGES_BASE_PATH: /${{ github.event.repository.name }}
      NEXT_PUBLIC_SERVER_URL: https://${{ github.repository_owner }}.github.io
      NODE_OPTIONS: --max-old-space-size=6000
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-
      - name: Install dependencies
        run: npm ci
      - name: Prepare static build
        run: node scripts/static-export.mjs prepare
      - name: Build with Next.js
        run: npx --no-install next build
      - name: Fix asset paths for Pages
        run: node scripts/static-export.mjs postbuild
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
